<style>
:root {
  --orange: #FF6B35; --orange-dark: #E55100; --orange-light: #FFE0B2;
  --bg: #F5F5F5; --card: #FFFFFF; --text: #2D2D2D; --text-light: #888;
  --border: #E0E0E0; --green: #4CAF50; --blue: #2196F3; --danger: #F44336;
  --radius: 14px; --shadow: 0 2px 10px rgba(0,0,0,0.06); --nav-h: 68px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; display:flex; justify-content:center; min-height:100vh; }
.app { width:100%; max-width:480px; min-height:100vh; padding-bottom:calc(var(--nav-h) + 16px); position:relative; }
.header { background:linear-gradient(135deg,var(--orange),var(--orange-dark)); color:white; padding:18px 20px 20px; text-align:center; position:sticky; top:0; z-index:10; border-radius:0 0 20px 20px; }
.header h1 { font-size:20px; font-weight:800; } .header .sub { font-size:12px; opacity:0.85; margin-top:2px; }
.tab-content { display:none; padding:14px 14px 0; } .tab-content.active { display:block; }
.card { background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
.card-title { font-size:15px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
/* Stats */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.stat-card { background:var(--card); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); text-align:center; }
.stat-card .label { font-size:11px; color:var(--text-light); margin-bottom:3px; }
.stat-card .value { font-size:22px; font-weight:800; }
.stat-card .unit { font-size:12px; font-weight:400; color:var(--text-light); }
.stat-card.orange .value { color:var(--orange); } .stat-card.green .value { color:var(--green); } .stat-card.blue .value { color:var(--blue); }
/* Category bar */
.cat-bar { display:flex; gap:6px; overflow-x:auto; padding:4px 0 10px; scrollbar-width:none; }
.cat-bar::-webkit-scrollbar { display:none; }
.cat-chip { flex-shrink:0; padding:7px 14px; border-radius:20px; border:1.5px solid var(--border); background:white; font-size:13px; cursor:pointer; white-space:nowrap; font-family:inherit; transition:all .2s; }
.cat-chip.active { background:var(--orange); color:white; border-color:var(--orange); font-weight:600; }
.cat-chip:active { transform:scale(.95); }
/* Exercise list */
.ex-item { display:flex; gap:12px; padding:12px; border-radius:12px; background:var(--bg); margin-bottom:8px; cursor:pointer; transition:all .2s; }
.ex-item:active { transform:scale(.98); }
.ex-icon { width:50px; height:50px; border-radius:12px; background:var(--orange-light); display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
.ex-info { flex:1; min-width:0; }
.ex-name { font-size:14px; font-weight:700; margin-bottom:3px; }
.ex-meta { font-size:11px; color:var(--text-light); display:flex; gap:8px; flex-wrap:wrap; }
.ex-meta span { white-space:nowrap; }
.ex-diff { font-size:10px; padding:2px 6px; border-radius:8px; font-weight:600; }
.diff-初级 { background:#E8F5E9; color:#2E7D32; } .diff-中级 { background:#FFF3E0; color:#E65100; } .diff-高级 { background:#FFEBEE; color:#C62828; }
/* Exercise detail */
.ex-detail-img { width:100%; height:160px; background:var(--orange-light); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:60px; margin-bottom:12px; }
.step-item { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.step-num { width:24px; height:24px; border-radius:50%; background:var(--orange); color:white; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.step-text { font-size:13px; line-height:1.5; flex:1; }
.info-row { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid var(--border); }
.info-row .l { color:var(--text-light); } .info-row .r { font-weight:600; }
.tip-box { background:#FFF3E0; border-radius:10px; padding:10px; font-size:13px; line-height:1.5; margin-top:8px; }
.tip-box strong { color:var(--orange-dark); }
/* Form */
.form-group { margin-bottom:10px; }
.form-group label { display:block; font-size:12px; font-weight:600; color:var(--text-light); margin-bottom:3px; }
.form-group input, .form-group select { width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; background:var(--bg); -webkit-appearance:none; }
.form-group input:focus, .form-group select:focus { outline:none; border-color:var(--orange); background:white; }
.btn { width:100%; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer; transition:all .2s; }
.btn-primary { background:linear-gradient(135deg,var(--orange),var(--orange-dark)); color:white; }
.btn-primary:active { transform:scale(.98); opacity:.9; }
.btn-outline { background:white; border:1.5px solid var(--orange); color:var(--orange); }
.btn-sm { width:auto; padding:7px 14px; font-size:12px; border-radius:8px; }
/* History */
.history-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
.history-item:last-child { border:none; } .history-item .info { flex:1; } .history-item .date { font-size:12px; color:var(--text-light); }
.history-item .detail { font-weight:600; font-size:13px; margin-top:2px; } .history-item .cal { font-weight:700; color:var(--orange); font-size:13px; }
.history-item .del { color:var(--danger); font-size:12px; cursor:pointer; padding:4px; }
/* Calendar heatmap */
.heatmap { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:8px; }
.heat-cell { aspect-ratio:1; border-radius:6px; background:#E8E8E8; font-size:9px; display:flex; align-items:center; justify-content:center; color:transparent; }
.heat-cell.has { background:var(--orange-light); color:rgba(0,0,0,.3); }
.heat-cell.l1 { background:#FFCC80; } .heat-cell.l2 { background:#FF9800; } .heat-cell.l3 { background:var(--orange); color:white; }
.heat-cell.l4 { background:var(--orange-dark); color:white; }
.heat-legend { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-light); margin-top:8px; justify-content:flex-end; }
.heat-legend .swatch { width:12px; height:12px; border-radius:3px; }
/* Plan */
.plan-day { padding:12px; border-radius:12px; background:var(--bg); margin-bottom:8px; cursor:pointer; }
.plan-day:active { opacity:.8; }
.plan-day .ph { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.plan-day .day-name { font-weight:700; font-size:14px; } .plan-day .day-target { font-size:12px; color:var(--text-light); }
.plan-day .day-badge { font-size:10px; padding:3px 8px; border-radius:10px; background:var(--orange-light); color:var(--orange-dark); font-weight:600; }
.plan-day .ex-list { font-size:12px; color:var(--text-light); line-height:1.6; }
/* Modal */
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:200; display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:white; border-radius:20px 20px 0 0; width:100%; max-width:480px; padding:20px; max-height:85vh; overflow-y:auto; animation:su .3s; }
@keyframes su { from{transform:translateY(100%);} to{transform:translateY(0);} }
.modal .close { float:right; background:none; border:none; font-size:24px; cursor:pointer; padding:4px 8px; color:var(--text-light); }
/* Bottom nav */
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:white; border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:7px 0 env(safe-area-inset-bottom,7px); z-index:100; }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 8px; font-size:10px; color:var(--text-light); cursor:pointer; border:none; background:none; font-family:inherit; }
.nav-item .icon { font-size:21px; } .nav-item.active { color:var(--orange); font-weight:600; }
.toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#333; color:white; padding:9px 22px; border-radius:20px; font-size:13px; z-index:300; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }
.empty { text-align:center; padding:36px 20px; color:var(--text-light); }
.empty .icon { font-size:44px; display:block; margin-bottom:10px; opacity:.4; }
.empty .text { font-size:13px; }
input[type=date] { color-scheme:light; }
.progress-bar { height:8px; background:var(--orange-light); border-radius:4px; overflow:hidden; margin-top:4px; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--orange),var(--orange-dark)); border-radius:4px; transition:width .5s; }
.chart-wrap { position:relative; height:200px; }

/* Backup buttons */
.backup-bar { display:flex; gap:8px; padding:8px 14px 14px; }
.backup-btn { flex:1; padding:8px; border:1.5px solid var(--border); border-radius:10px; background:white; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:4px; }
.backup-btn:active { background:var(--bg); }
.backup-btn.export { border-color:var(--orange); color:var(--orange); }
.backup-btn.import { border-color:var(--blue); color:var(--blue); }
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>💪 健身教练</h1><div class="sub">新手训练指南 · 健身房减脂塑形</div></div>

  <!-- TAB: HOME -->
  <div class="tab-content active" id="tab-home">
    <div class="stats-grid">
      <div class="stat-card orange"><div class="label">🔥 本周训练</div><div class="value" id="hw-count">0<span class="unit">次</span></div></div>
      <div class="stat-card green"><div class="label">📊 累计训练</div><div class="value" id="total-count">0<span class="unit">次</span></div></div>
      <div class="stat-card blue"><div class="label">🏃 累计消耗</div><div class="value" id="total-cal">0<span class="unit">大卡</span></div></div>
      <div class="stat-card orange"><div class="label">⚖️ 当前体重</div><div class="value" id="home-weight">--<span class="unit">kg</span></div></div>
    </div>
    <div class="card">
      <div class="card-title">📅 今日推荐</div>
      <div id="today-rec"></div>
    </div>
    <div class="card">
      <div class="card-title">🔥 本周训练热力图</div>
      <div class="heatmap" id="heatmap"></div>
      <div class="heat-legend">
        <span>少</span>
        <div class="swatch" style="background:#E8E8E8"></div>
        <div class="swatch" style="background:#FFCC80"></div>
        <div class="swatch" style="background:#FF9800"></div>
        <div class="swatch" style="background:#FF6B35"></div>
        <div class="swatch" style="background:#E55100"></div>
        <span>多</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">💡 新手贴士</div>
      <div style="font-size:13px;line-height:1.6;color:var(--text-light);" id="daily-tip">热身5-10分钟再开始训练，避免受伤。新手先学动作，重量次之。</div>
    </div>
  </div>

  <!-- TAB: EXERCISES -->
  <div class="tab-content" id="tab-exercises">
    <div class="cat-bar" id="cat-bar"></div>
    <div id="ex-list"></div>
  </div>

  <!-- TAB: LOG -->
  <div class="tab-content" id="tab-log">
    <div class="card">
      <div class="card-title">📝 记录今日训练</div>
      <div class="form-group"><label>动作</label><select id="log-ex"></select></div>
      <div class="form-group"><label>组数</label><input type="number" id="log-sets" placeholder="例如：4" min="1" max="20" inputmode="numeric"></div>
      <div class="form-group"><label>每组次数</label><input type="number" id="log-reps" placeholder="例如：12" min="1" max="100" inputmode="numeric"></div>
      <div class="form-group"><label>重量(kg，可选)</label><input type="number" id="log-weight" placeholder="例如：40" min="0" max="500" inputmode="decimal" step="0.5"></div>
      <div class="form-group"><label>日期</label><input type="date" id="log-date"></div>
      <button class="btn btn-primary" onclick="addLog()">✅ 记录训练</button>
    </div>
    <div class="card">
      <div class="card-title">📋 训练记录</div>
      <div id="log-list"></div>
      <div class="empty" id="log-empty"><span class="icon">📝</span><div class="text">还没有训练记录<br>开始你的第一次训练吧！</div></div>
    </div>
  </div>

  <!-- TAB: BODY -->
  <div class="tab-content" id="tab-body">
    <div class="card">
      <div class="card-title">⚖️ 记录身体数据</div>
      <div class="form-group"><label>体重(kg)</label><input type="number" id="body-weight" placeholder="例如：65.5" step="0.1" min="30" max="200" inputmode="decimal"></div>
      <div class="form-group"><label>体脂率(%, 可选)</label><input type="number" id="body-fat" placeholder="例如：22" step="0.1" min="3" max="60" inputmode="decimal"></div>
      <div class="form-group"><label>日期</label><input type="date" id="body-date"></div>
      <button class="btn btn-primary" onclick="addBody()">💾 保存数据</button>
    </div>
    <div class="card">
      <div class="card-title">📈 体重趋势</div>
      <div class="chart-wrap"><canvas id="weightChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">📋 身体数据历史</div>
      <div id="body-list"></div>
      <div class="empty" id="body-empty"><span class="icon">⚖️</span><div class="text">还没有身体数据<br>记录你的起点吧！</div></div>
    </div>
  </div>

  <!-- TAB: PLAN -->
  <div class="tab-content" id="tab-plan">
    <div class="card">
      <div class="card-title">🗓️ 推荐训练计划</div>
      <div style="font-size:13px;color:var(--text-light);margin-bottom:10px;">新手4天分割计划，每次45-60分钟。每周训练4天，休息3天。</div>
      <div id="plan-list"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')"><span class="icon">🏠</span>首页</button>
    <button class="nav-item" data-tab="exercises" onclick="switchTab('exercises')"><span class="icon">💪</span>动作</button>
    <button class="nav-item" data-tab="log" onclick="switchTab('log')"><span class="icon">📝</span>打卡</button>
    <button class="nav-item" data-tab="body" onclick="switchTab('body')"><span class="icon">⚖️</span>数据</button>
    <button class="nav-item" data-tab="plan" onclick="switchTab('plan')"><span class="icon">🗓️</span>计划</button>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()"></div>
</div>
<div class="toast" id="toast"></div>

<script>const EXERCISES = [
  // ==================== 胸部 chest ====================
  {

    name: '杠铃卧推',

    muscle: '胸大肌、三角肌前束、肱三头肌',
    sets: '4组 × 8-12次',
    rest: '60-90秒',

<script>
// ========== Storage ==========
function load(k) { try { return JSON.parse(localStorage.getItem('fit_'+k))||[]; } catch(e){ return []; } }
function save(k,d) { localStorage.setItem('fit_'+k, JSON.stringify(d)); }
let toastT;
function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }
function today() { return new Date().toISOString().split('T')[0]; }
function switchTab(t) {
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  document.querySelector(`[data-tab="${t}"]`).classList.add('active');
  if(t==='home') refreshHome();
  if(t==='exercises') refreshEx();
  if(t==='log') refreshLog();
  if(t==='body') refreshBody();
}
function showModal(html){ document.getElementById('modal-content').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(e){ if(e&&e.target.id!=='modal')return; document.getElementById('modal').classList.remove('show'); }

// ========== Categories ==========
const CATS = [
  {id:'all',name:'🔍 全部'},{id:'chest',name:'💪 胸部'},{id:'back',name:'🔙 背部'},
  {id:'shoulders',name:'🏔️ 肩膀'},{id:'arms',name:'💪 手臂'},{id:'legs',name:'🦵 腿部'},
  {id:'core',name:'🔥 核心'},{id:'cardio',name:'🏃 有氧'}
];
let exFilter='all';

function refreshEx() {
  const bar=document.getElementById('cat-bar');
  bar.innerHTML=CATS.map(c=>`<button class="cat-chip${exFilter===c.id?' active':''}" onclick="filterEx('${c.id}')">${c.name}</button>`).join('');
  renderExList();
}
function filterEx(id){ exFilter=id; refreshEx(); }
function renderExList() {
  const list=document.getElementById('ex-list');
  const filtered=exFilter==='all'?EXERCISES:EXERCISES.filter(e=>e.category===exFilter);
  list.innerHTML=filtered.map(e=>`
    <div class="ex-item" onclick="viewEx('${e.id}')">
      <div class="ex-icon">${e.demo}</div>
      <div class="ex-info">
        <div class="ex-name">${e.name}</div>
        <div class="ex-meta">
          <span>🏋️ ${e.equipment}</span>
          <span>📊 ${e.sets}</span>
          <span class="ex-diff diff-${e.difficulty}">${e.difficulty}</span>
        </div>
      </div>
    </div>`).join('');
}
function viewEx(id) {
  const e=EXERCISES.find(x=>x.id===id); if(!e)return;
  showModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h3 style="margin-top:6px">${e.demo} ${e.name}</h3>
    <div class="ex-detail-img">${e.demo}</div>
    <div class="info-row"><span class="l">🎯 目标肌群</span><span class="r">${e.muscle}</span></div>
    <div class="info-row"><span class="l">🏋️ 器材</span><span class="r">${e.equipment}</span></div>
    <div class="info-row"><span class="l">📊 组数次数</span><span class="r">${e.sets}</span></div>
    <div class="info-row"><span class="l">⏱️ 休息时间</span><span class="r">${e.rest}</span></div>
    <div class="info-row"><span class="l">🔥 估算消耗</span><span class="r">~${e.calories}大卡</span></div>
    <div class="info-row"><span class="l">📈 难度</span><span class="r">${e.difficulty}</span></div>
    <h4 style="margin:12px 0 6px">📋 动作步骤</h4>
    ${e.steps.map((s,i)=>`<div class="step-item"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}
    <div class="tip-box">💡 <strong>要点提示：</strong>${e.tips}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="quickLog('${e.id}')">📝 立即记录此动作</button>
  `);
}
function quickLog(id) {
  closeModal();
  switchTab('log');
  document.getElementById('log-ex').value=id;
  toast('已选择动作，填写组数次数即可记录');
}

// ========== Training Log ==========
function initLogSelect() {
  const sel=document.getElementById('log-ex');
  sel.innerHTML=EXERCISES.map(e=>`<option value="${e.id}">${e.demo} ${e.name} (${e.categoryName})</option>`).join('');
  document.getElementById('log-date').value=today();
}
function addLog() {
  const exId=document.getElementById('log-ex').value;
  const sets=parseInt(document.getElementById('log-sets').value);
  const reps=parseInt(document.getElementById('log-reps').value);
  const weight=parseFloat(document.getElementById('log-weight').value)||0;
  const date=document.getElementById('log-date').value||today();
  if(!sets||sets<=0) return toast('⚠️ 请输入组数');
  if(!reps||reps<=0) return toast('⚠️ 请输入次数');
  const ex=EXERCISES.find(e=>e.id===exId);
  const cal=Math.round(ex.calories*(sets/4));
  const data=load('logs');
  data.push({id:Date.now(),exId,exName:ex.name,exDemo:ex.demo,category:ex.categoryName,sets,reps,weight,cal,date});
  save('logs',data);
  document.getElementById('log-sets').value='';
  document.getElementById('log-reps').value='';
  document.getElementById('log-weight').value='';
  toast(`✅ 已记录！${ex.name} ${sets}×${reps} 消耗~${cal}大卡`);
  refreshLog(); refreshHome();
}
function delLog(id){ let d=load('logs'); d=d.filter(l=>l.id!==id); save('logs',d); refreshLog(); refreshHome(); }
function refreshLog() {
  const data=load('logs');
  const list=document.getElementById('log-list');
  const empty=document.getElementById('log-empty');
  if(data.length===0){ list.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  list.innerHTML=[...data].reverse().slice(0,80).map(l=>`
    <div class="history-item">
      <div class="info"><div class="date">${l.date} · ${l.category}</div>
      <div class="detail">${l.exDemo} ${l.exName} · ${l.sets}组×${l.reps}次${l.weight?' · '+l.weight+'kg':''}</div></div>
      <div style="text-align:right"><div class="cal">🔥${l.cal}</div><span class="del" onclick="delLog(${l.id})">✕</span></div>
    </div>`).join('');
}

// ========== Body Data ==========
function addBody() {
  const w=parseFloat(document.getElementById('body-weight').value);
  const f=parseFloat(document.getElementById('body-fat').value)||0;
  const date=document.getElementById('body-date').value||today();
  if(!w||w<30||w>200) return toast('⚠️ 请输入合理体重');
  let data=load('body');
  const idx=data.findIndex(b=>b.date===date);
  if(idx>=0){ data[idx].weight=w; data[idx].fat=f; }
  else data.push({id:Date.now(),date,weight:w,fat:f});
  data.sort((a,b)=>a.date.localeCompare(b.date));
  save('body',data);
  document.getElementById('body-weight').value='';
  document.getElementById('body-fat').value='';
  toast('✅ 身体数据已保存');
  refreshBody(); refreshHome();
}
function delBody(id){ let d=load('body'); d=d.filter(b=>b.id!==id); save('body',d); refreshBody(); refreshHome(); }
function refreshBody() {
  const data=load('body');
  const list=document.getElementById('body-list');
  const empty=document.getElementById('body-empty');
  document.getElementById('body-date').value=today();
  if(data.length===0){ list.innerHTML=''; empty.style.display='block'; drawBodyChart([]); return; }
  empty.style.display='none';
  list.innerHTML=[...data].reverse().map(b=>`
    <div class="history-item">
      <div class="info"><div class="date">${b.date}</div>
      <div class="detail">${b.weight}kg${b.fat?' · 体脂'+b.fat+'%':''}</div></div>
      <span class="del" onclick="delBody(${b.id})">✕</span>
    </div>`).join('');
  drawBodyChart(data);
}
let bodyChart=null;
function drawBodyChart(data) {
  const ctx=document.getElementById('weightChart').getContext('2d');
  if(bodyChart) bodyChart.destroy();
  const labels=data.map(d=>d.date);
  const weights=data.map(d=>d.weight);
  const allLabels=data.length>0?labels:[''];
  const allVals=data.length>0?weights:[0];
  bodyChart=new Chart(ctx,{type:'line',data:{labels:allLabels,datasets:[{
    label:'体重(kg)',data:allVals,borderColor:'#FF6B35',backgroundColor:'rgba(255,107,53,0.1)',
    fill:true,tension:.3,pointRadius:4,pointBackgroundColor:'#FF6B35',pointBorderColor:'white',pointBorderWidth:2
  }]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
  scales:{x:{grid:{display:false},ticks:{font:{size:10},maxTicksLimit:6}},
  y:{ticks:{font:{size:10},callback:v=>v+'kg'}}}}});
}

// ========== Home ==========
function refreshHome() {
  const logs=load('logs');
  const body=load('body');
  // This week
  const now=new Date(); const weekStart=new Date(now); weekStart.setDate(now.getDate()-now.getDay()); weekStart.setHours(0,0,0,0);
  const weekLogs=logs.filter(l=>new Date(l.date)>=weekStart);
  document.getElementById('hw-count').innerHTML=weekLogs.length+'<span class="unit">次</span>';
  document.getElementById('total-count').innerHTML=logs.length+'<span class="unit">次</span>';
  const totalCal=logs.reduce((s,l)=>s+l.cal,0);
  document.getElementById('total-cal').innerHTML=totalCal+'<span class="unit">大卡</span>';
  const lastWeight=body.length>0?body[body.length-1].weight:0;
  document.getElementById('home-weight').innerHTML=(lastWeight?lastWeight:'--')+'<span class="unit">kg</span>';
  // Today's recommendation
  const dayOfWeek=now.getDay();
  const planDay=PLAN[dayOfWeek]||PLAN[1];
  document.getElementById('today-rec').innerHTML=`
    <div class="plan-day" onclick="switchTab('plan')">
      <div class="ph"><span class="day-name">${planDay.name}</span><span class="day-badge">${planDay.target}</span></div>
      <div class="ex-list">${planDay.exercises}</div>
    </div>`;
  // Heatmap (last 28 days = 4 weeks)
  const hm=document.getElementById('heatmap');
  let html='';
  for(let i=27;i>=0;i--) {
    const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().split('T')[0];
    const dayLogs=logs.filter(l=>l.date===ds);
    const cal=dayLogs.reduce((s,l)=>s+l.cal,0);
    let lvl=''; if(cal>0){ if(cal<100)lvl='l1'; else if(cal<250)lvl='l2'; else if(cal<400)lvl='l3'; else lvl='l4'; }
    const dayNum=d.getDate();
    html+=`<div class="heat-cell ${lvl}" title="${ds}: ${cal}大卡">${dayNum}</div>`;
  }
  hm.innerHTML=html;
  // Tip
  const tips=[
    '热身5-10分钟再开始训练，避免受伤。新手先学动作，重量次之。',
    '训练后拉伸5-10分钟，帮助肌肉恢复，减少酸痛。',
    '每组之间休息60-90秒，不要太长也不要太短。',
    '呼吸很重要！发力时呼气，放松时吸气。',
    '动作要慢，特别是下放阶段，控制肌肉感受。',
    '训练前1小时吃点碳水和蛋白质，有能量练得更好。',
    '训练后30分钟内补充蛋白质，帮助肌肉修复。',
    '多喝水！训练时每15分钟喝几口水。',
    '不要每天都练同一个部位，肌肉需要48小时恢复。',
    '睡眠是最好的恢复，保证7-8小时。'
  ];
  document.getElementById('daily-tip').textContent=tips[Math.floor(Math.random()*tips.length)];
}

// ========== Backup / Restore ==========
function exportData() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith('fit_')) data[key] = localStorage.getItem(key);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '健身教练_备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('✅ 数据已导出！');
}

function importData() { document.getElementById('import-file').click(); }

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      let count = 0;
      for (const [key, value] of Object.entries(data)) {
        localStorage.setItem(key, value);
        count++;
      }
      toast(`✅ 已恢复 ${count} 条数据！刷新中...`);
      setTimeout(() => location.reload(), 1500);
    } catch (err) {
      toast('⚠️ 文件格式错误');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function init() {
  initLogSelect();
  refreshHome();
  refreshEx();
  refreshLog();
  refreshBody();
  refreshPlan();
}
init();
